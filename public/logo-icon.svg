<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="roseGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D75"/>
      <stop offset="60%" stop-color="#C23854"/>
      <stop offset="100%" stop-color="#8F1D35"/>
    </linearGradient>

    <linearGradient id="goldGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="50%" stop-color="#F5C362"/>
      <stop offset="100%" stop-color="#D99426"/>
    </linearGradient>

    <linearGradient id="frostingGradientIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF2EC"/>
    </linearGradient>

    <filter id="iconSoftDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4A0E1A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Badge -->
  <rect x="1" y="1" width="46" height="46" rx="13.5" fill="url(#roseGradientIcon)"/>
  <rect x="1.75" y="1.75" width="44.5" height="44.5" rx="12.75" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Cake Icon Group -->
  <g filter="url(#iconSoftDrop)">
    <path d="M12 32.5 C12 30.5 13.6 29 15.7 29 L32.3 29 C34.4 29 36 30.5 36 32.5 C36 34.5 34.4 36 32.3 36 L15.7 36 C13.6 36 12 34.5 12 32.5 Z" fill="url(#frostingGradientIcon)"/>
    <path d="M15.5 32.5 Q20 34 24 32.5 Q28 31 32.5 32.5" fill="none" stroke="#E85D75" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <path d="M16 22.5 C16 20.8 17.4 19.5 19.3 19.5 L28.7 19.5 C30.6 19.5 32 20.8 32 22.5 C32 24.2 30.6 25.5 28.7 25.5 L19.3 25.5 C17.4 25.5 16 24.2 16 22.5 Z" fill="url(#frostingGradientIcon)"/>

    <path d="M24 7.5 C24 10.5 25.6 12.2 28.5 12.5 C25.6 12.8 24 14.5 24 17.5 C24 14.5 22.4 12.8 19.5 12.5 C22.4 12.2 24 10.5 24 7.5 Z" fill="url(#goldGradientIcon)"/>

    <circle cx="34.5" cy="18" r="1.3" fill="url(#goldGradientIcon)"/>
    <circle cx="13.5" cy="20.5" r="1" fill="url(#goldGradientIcon)" opacity="0.85"/>
  </g>
</svg>

