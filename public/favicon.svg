<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Background Gradient: Rich Velvet Rose to Deep Berry -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D75"/>
      <stop offset="60%" stop-color="#C23854"/>
      <stop offset="100%" stop-color="#8F1D35"/>
    </linearGradient>

    <!-- Warm Golden Flame Gradient -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="50%" stop-color="#F5C362"/>
      <stop offset="100%" stop-color="#D99426"/>
    </linearGradient>

    <!-- Subtle Frosting Highlight Gradient -->
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF2EC"/>
    </linearGradient>

    <!-- Drop Shadow for layered depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4A0E1A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Badge with smooth corner radius -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border for High-End Glass/Enamel Finish -->
  <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="12.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Cake Icon Group -->
  <g filter="url(#softShadow)">
    <!-- Base Tier (Foundation) -->
    <path d="M12.5 32.5 C12.5 30.5 14.1 29 16.2 29 L31.8 29 C33.9 29 35.5 30.5 35.5 32.5 C35.5 34.5 33.9 36 31.8 36 L16.2 36 C14.1 36 12.5 34.5 12.5 32.5 Z" fill="url(#frostingGrad)"/>
    
    <!-- Delicate Base Tier Piping Line / Accent -->
    <path d="M16 32.5 Q20 34 24 32.5 Q28 31 32 32.5" fill="none" stroke="#E85D75" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <!-- Middle Tier (Upper Tier) -->
    <path d="M16.5 22.5 C16.5 20.8 17.9 19.5 19.8 19.5 L28.2 19.5 C30.1 19.5 31.5 20.8 31.5 22.5 C31.5 24.2 30.1 25.5 28.2 25.5 L19.8 25.5 C17.9 25.5 16.5 24.2 16.5 22.5 Z" fill="url(#frostingGrad)"/>

    <!-- Celebration Star Spark (Candle Flame) -->
    <path d="M24 7.5 C24 10.5 25.6 12.2 28.5 12.5 C25.6 12.8 24 14.5 24 17.5 C24 14.5 22.4 12.8 19.5 12.5 C22.4 12.2 24 10.5 24 7.5 Z" fill="url(#goldSpark)"/>

    <!-- Micro Artisan Crumbs / Golden Sparks -->
    <circle cx="34.5" cy="18" r="1.3" fill="url(#goldSpark)"/>
    <circle cx="13.5" cy="20.5" r="1" fill="url(#goldSpark)" opacity="0.85"/>
  </g>
</svg>

